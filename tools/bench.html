<!doctype html>
<meta charset="utf-8"><title>Bancada de render</title>
<style>html,body{margin:0;background:#2b2f33;overflow:hidden}canvas{display:block}</style>
<div id="app"><canvas id="scope" hidden></canvas><canvas id="airhud" hidden></canvas><canvas id="xray" hidden></canvas><canvas id="mini" hidden></canvas><canvas id="status" hidden></canvas><div id="feed"></div><div id="labels"></div></div>
<script type="module">
// Bancada de inspeção: um veículo isolado em 6 ângulos numa folha só. ?k=f4e&gear=1 (trem 0..1)
import * as THREE from 'three';
import { PLANES, VEHICLES } from '/src/data/vehicles.js';
const q = new URLSearchParams(location.search), key = q.get('k') || 'f4e', gear = +(q.get('gear') ?? 1);
import RAPIER from '@dimforge/rapier3d-compat'; await RAPIER.init();
const D = VEHICLES[key] || PLANES[key];
const W = 1800, H = 1000, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setScissorTest(true); r.shadowMap.enabled = false; document.body.append(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b2f33);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x4a4036, 1.6));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(6, 10, 8); scene.add(sun);
const back = new THREE.DirectionalLight(0x8899bb, 0.9); back.position.set(-8, 3, -6); scene.add(back);
if (!q.get('glb') && D.type === 'plane') await (await import('/src/vehicles/modelLibrary.js')).preloadModels([D]);
if (!q.get('glb') && D.type !== 'plane') await (await import('/src/vehicles/tankModel.js')).preloadTankModels([D]);
// ?glb=/models/x.glb: mostra o arquivo cru (conferir o preparo do Blender), sem montar veículo
const m = q.get('glb') ? { root: (await new (await import('three/addons/loaders/GLTFLoader.js')).GLTFLoader().loadAsync(q.get('glb'))).scene } : D.type === 'plane' ? (await import('/src/vehicles/planeModel.js')).buildPlane(D) : (await import('/src/vehicles/tank.js')).buildTank(D);
if (m.gearMesh && m.gearMesh.userData.anim) m.gearMesh.userData.anim(gear);
if (m.turret) { m.turret.rotation.y = (+q.get('tur') || 0) * Math.PI / 180; m.gunPivot.rotation.x = -(+q.get('el') || 0) * Math.PI / 180; } // ?tur=40&el=10: torre girada e canhão elevado
if (m.trackAnim) { const o = +q.get('trk') || 0; m.trackAnim([o, o]); for (const w of m.wheels) w.m.rotation.x = o / w.r; } // ?trk=0.07: esteira andada (m)
scene.add(m.root); m.root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(m.root), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()), R = Math.max(s.x, s.y, s.z) * 0.95;
// frente do veículo = +z; ângulos: [yaw, pitch, nome]
const V = [[90, 8, 'lado'], [0, 8, 'frente'], [180, 8, 'trás'], [0, 89, 'cima'], [40, 22, '3/4 frente'], [140, 22, '3/4 trás']];
const cam = new THREE.PerspectiveCamera(32, (W / 3) / (H / 2), 0.1, 500); cam.layers.enableAll();
const one = q.get('v'); // ?v=yaw,pitch,zoom: uma vista grande só (zoom < 1 aproxima)
const VV = one ? [one.split(',').map(Number)] : V, NX = one ? 1 : 3, NY = one ? 1 : 2; if (one) cam.aspect = W / H, cam.updateProjectionMatrix();
VV.forEach(([yaw, pitch, zoom = 1], i) => {
  const x = (i % NX) * W / NX, y = (NY - 1 - Math.floor(i / NX)) * H / NY, a = yaw * Math.PI / 180, p = pitch * Math.PI / 180, d = R * 1.95 * (+zoom || 1); // nas 6 vistas o 3º item é o nome, não zoom
  r.setViewport(x, y, W / NX, H / NY); r.setScissor(x, y, W / NX, H / NY);
  cam.position.set(c.x + Math.sin(a) * Math.cos(p) * d, c.y + Math.sin(p) * d, c.z + Math.cos(a) * Math.cos(p) * d); cam.up.set(0, 1, 0);
  if (pitch > 80) cam.up.set(0, 0, -1);
  cam.lookAt(c); r.render(scene, cam);
});
console.log("BOX", JSON.stringify(box.min.toArray().map(v=>+v.toFixed(2))), JSON.stringify(box.max.toArray().map(v=>+v.toFixed(2))), "R", R, "kids", m.root.children.length, "vis", m.root.visible, "scale", m.root.scale.x);
document.querySelectorAll("canvas").forEach(c => { if (c !== r.domElement) c.style.display = "none"; });
window.__r = r; window.__scene = scene; window.__done = true;
</script>
